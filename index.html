<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahir Berhitung - Mari Belajar Berhitung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f6f9ff;
            --dot-color: #bfdbfe;
            --card-border: #dbeafe;
            --primary-blue: #2563eb;
            --soft-blue: #eef6ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            background-image: radial-gradient(var(--dot-color) 1.35px, transparent 1.35px);
            background-size: 22px 22px;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        .soft-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1.5px solid #dbeafe;
            box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.06), 0 2px 6px -1px rgba(37, 99, 235, 0.04);
        }

        .soft-btn {
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .soft-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        /* Kotak Input Angka */
        .digit-box {
            width: 2.75rem;
            height: 2.95rem;
            text-align: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            border-radius: 0.75rem;
            border: 2px dashed #93c5fd;
            background-color: #f8fbff;
            color: #1e3a8a;
            transition: all 0.15s ease;
            caret-color: transparent;
            cursor: pointer;
            user-select: none;
        }

        .digit-box:focus,
        .digit-box.active-input {
            outline: none;
            border-style: solid;
            border-color: #2563eb;
            background-color: #eff6ff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
            transform: translateY(-1px);
        }

        /* Kotak Simpanan di Atas */
        .carry-box {
            width: 2.15rem;
            height: 2.15rem;
            text-align: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 0.55rem;
            border: 1.8px dashed #cbd5e1;
            background-color: #f8fafc;
            color: #0284c7;
            transition: all 0.15s ease;
            caret-color: transparent;
            cursor: pointer;
            user-select: none;
        }

        .carry-box:focus,
        .carry-box.active-input {
            outline: none;
            border-style: solid;
            border-color: #38bdf8;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Kotak Hasil Bagi di Atas Porogapit */
        .quotient-box {
            border-color: #6ee7b7;
            background-color: #f0fdf4;
            color: #065f46;
        }

        .quotient-box:focus,
        .quotient-box.active-input {
            border-style: solid;
            border-color: #10b981;
            background-color: #ecfdf5;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
        }

        /* Status Benar & Salah */
        .correct-box {
            border-style: solid !important;
            border-color: #34d399 !important;
            background-color: #ecfdf5 !important;
            color: #047857 !important;
        }

        .wrong-box {
            border-style: solid !important;
            border-color: #fda4af !important;
            background-color: #fff1f2 !important;
            color: #be123c !important;
            animation: shake 0.35s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-3px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.22s ease-out forwards;
        }

        /* Hilangkan spinner pada input jika ada */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="pb-32 lg:pb-28">

    <!-- Kontainer Utama Split Screen (2 Layar: Kiri & Kanan) -->
    <main class="max-w-6xl mx-auto px-3.5 sm:px-5 pt-3.5 md:pt-5">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 items-start">

            <!-- ================= LAYAR SEBELAH KIRI (Panel Kontrol & Menu) ================= -->
            <aside class="lg:col-span-5 lg:sticky lg:top-4 space-y-3">
                
                <!-- Bar Informasi Atas: Indikator Level, Skor, Streak, & Suara -->
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span id="active-mode-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-[#eef6ff] text-[#1d4ed8] border border-[#bfdbfe]">
                            Tambah • Pemula
                        </span>
                        <div class="flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-[#ecfdf5] text-[#047857] border border-[#a7f3d0]" title="Skor pada kategori & level ini">
                            <span>⭐</span>
                            <span id="score-display">0</span>
                        </div>
                        <div class="flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-[#fff1f2] text-[#e11d48] border border-[#fecdd3]" title="Streak berkurang 1 jika salah">
                            <span>🔥</span>
                            <span>Streak: <strong id="streak-display">0</strong></span>
                        </div>
                    </div>

                    <button id="sound-btn" onclick="toggleSound()" class="w-9 h-9 rounded-full soft-card flex items-center justify-center text-base hover:bg-[#eff6ff] soft-btn" title="Pengaturan Suara">
                        🔊
                    </button>
                </div>

                <!-- Header Nama Game & Logo Proporsional -->
                <div class="flex items-center justify-between gap-3 pt-0.5">
                    <div class="flex items-center gap-3.5">
                        <!-- Logo Sempoa Proporsional -->
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-[#2563eb] to-[#1d4ed8] flex items-center justify-center shadow-sm border border-[#93c5fd] shrink-0">
                            <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="4" y="5" width="28" height="26" rx="4" stroke="#ffedd5" stroke-width="2.5" fill="#1e40af"/>
                                <line x1="7" y1="11" x2="29" y2="11" stroke="#cbd5e1" stroke-width="2"/>
                                <line x1="7" y1="18" x2="29" y2="18" stroke="#cbd5e1" stroke-width="2"/>
                                <line x1="7" y1="25" x2="29" y2="25" stroke="#cbd5e1" stroke-width="2"/>
                                <!-- Manik-manik sempoa -->
                                <circle cx="11" cy="11" r="2.3" fill="#fb7185"/>
                                <circle cx="16.5" cy="11" r="2.3" fill="#fb7185"/>
                                <circle cx="25" cy="11" r="2.3" fill="#fb7185"/>
                                <circle cx="11" cy="18" r="2.3" fill="#38bdf8"/>
                                <circle cx="20" cy="18" r="2.3" fill="#38bdf8"/>
                                <circle cx="25" cy="18" r="2.3" fill="#38bdf8"/>
                                <circle cx="13" cy="25" r="2.3" fill="#fbbf24"/>
                                <circle cx="18.5" cy="25" r="2.3" fill="#34d399"/>
                                <circle cx="24" cy="25" r="2.3" fill="#34d399"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="font-display text-2xl sm:text-3xl font-bold text-[#1e3a8a] leading-tight tracking-tight">
                                Mahir Berhitung
                            </h1>
                            <p class="text-xs sm:text-sm font-semibold text-[#2563eb] mt-0.5">
                                Mari Belajar Berhitung
                            </p>
                        </div>
                    </div>

                    <button onclick="generateNewSet()" class="px-3.5 py-2 rounded-xl soft-card text-xs sm:text-sm font-bold text-[#1d4ed8] hover:bg-[#eff6ff] flex items-center gap-1.5 soft-btn shrink-0">
                        <span class="text-sm">🔄</span> Acak Soal
                    </button>
                </div>

                <!-- Kotak Deskripsi Petunjuk Singkat -->
                <div id="top-instruction-box" class="soft-card rounded-2xl p-3 text-xs sm:text-sm text-[#334155] leading-relaxed">
                    Isi setiap kotak dengan satu angka. Kerjakan dari <strong class="text-[#1d4ed8]">kanan ke kiri</strong>; setelah mengetik, kursor pindah sendiri ke kotak sebelah kiri.
                </div>

                <!-- 1 Tombol Beralih ke Soal Pecahan Biasa / Berhitung Bersusun -->
                <div>
                    <button id="toggle-fraction-mode-btn" onclick="toggleGameMode()" class="w-full py-2.5 px-4 rounded-2xl border-2 border-[#bfdbfe] bg-gradient-to-r from-[#eef6ff] via-[#f5f3ff] to-[#eef6ff] hover:from-[#dbeafe] hover:to-[#ede9fe] text-[#1e3a8a] font-bold text-xs sm:text-sm flex items-center justify-between shadow-sm soft-btn">
                        <span class="flex items-center gap-2">
                            <span id="mode-switch-icon" class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-[#2563eb] text-white font-display text-xs font-bold">½</span>
                            <span id="mode-switch-text">Beralih ke Soal Pecahan Biasa</span>
                        </span>
                        <span id="mode-switch-pill" class="px-2.5 py-0.5 rounded-full text-[11px] bg-white text-[#2563eb] border border-[#bfdbfe] font-semibold">
                            Mode: Bersusun
                        </span>
                    </button>
                </div>

                <!-- Pilihan 5 Kategori Operasi Hitung -->
                <div class="grid grid-cols-5 gap-2">
                    <button onclick="setOperation('tambah')" id="op-tambah" class="op-btn soft-card rounded-2xl py-2.5 px-1 flex flex-col items-center justify-center gap-1 soft-btn">
                        <div class="w-8 h-8 rounded-xl bg-[#dbeafe] text-[#1d4ed8] font-display font-bold text-lg flex items-center justify-center">+</div>
                        <span class="text-[11px] sm:text-xs font-bold text-[#1e293b]">Tambah</span>
                    </button>
                    <button onclick="setOperation('kurang')" id="op-kurang" class="op-btn soft-card rounded-2xl py-2.5 px-1 flex flex-col items-center justify-center gap-1 soft-btn">
                        <div class="w-8 h-8 rounded-xl bg-[#ffe4e6] text-[#e11d48] font-display font-bold text-lg flex items-center justify-center">−</div>
                        <span class="text-[11px] sm:text-xs font-bold text-[#1e293b]">Kurang</span>
                    </button>
                    <button onclick="setOperation('kali')" id="op-kali" class="op-btn soft-card rounded-2xl py-2.5 px-1 flex flex-col items-center justify-center gap-1 soft-btn">
                        <div class="w-8 h-8 rounded-xl bg-[#d1fae5] text-[#047857] font-display font-bold text-lg flex items-center justify-center">×</div>
                        <span class="text-[11px] sm:text-xs font-bold text-[#1e293b]">Kali</span>
                    </button>
                    <button onclick="setOperation('bagi')" id="op-bagi" class="op-btn soft-card rounded-2xl py-2.5 px-1 flex flex-col items-center justify-center gap-1 soft-btn">
                        <div class="w-8 h-8 rounded-xl bg-[#e0f2fe] text-[#0369a1] font-display font-bold text-lg flex items-center justify-center">:</div>
                        <span class="text-[11px] sm:text-xs font-bold text-[#1e293b]">Bagi</span>
                    </button>
                    <button onclick="setOperation('cerita')" id="op-cerita" class="op-btn soft-card rounded-2xl py-2.5 px-1 flex flex-col items-center justify-center gap-1 soft-btn">
                        <div class="w-8 h-8 rounded-xl bg-[#fef3c7] text-[#b45309] font-display font-bold text-base flex items-center justify-center">📖</div>
                        <span class="text-[11px] sm:text-xs font-bold text-[#1e293b]">Cerita</span>
                    </button>
                </div>

                <!-- Pilihan Level (Pemula, Mahir, Juara) + Toggle Kotak Simpanan -->
                <div class="flex flex-wrap items-center gap-2">
                    <div class="grid grid-cols-3 gap-2 flex-1 min-w-[240px]">
                        <button onclick="setDifficulty('mudah')" id="diff-mudah" class="diff-btn soft-card rounded-2xl py-2 px-2 text-center soft-btn">
                            <div class="text-xs font-bold text-[#1e293b]">🌱 Pemula</div>
                            <div class="text-[10px] text-[#64748b] font-medium">Kelas 2–3</div>
                        </button>
                        <button onclick="setDifficulty('sedang')" id="diff-sedang" class="diff-btn soft-card rounded-2xl py-2 px-2 text-center soft-btn">
                            <div class="text-xs font-bold text-[#1e293b]">🚀 Mahir</div>
                            <div class="text-[10px] text-[#64748b] font-medium">Kelas 3–4</div>
                        </button>
                        <button onclick="setDifficulty('sulit')" id="diff-sulit" class="diff-btn soft-card rounded-2xl py-2 px-2 text-center soft-btn">
                            <div class="text-xs font-bold text-[#1e293b]">👑 Juara</div>
                            <div class="text-[10px] text-[#64748b] font-medium">Kelas 4–6</div>
                        </button>
                    </div>

                    <!-- Checkbox Kotak Simpanan (Hanya untuk Tambah & Kali Bersusun) -->
                    <label id="carry-toggle-wrap" class="soft-card rounded-2xl px-3 py-2.5 flex items-center gap-2 cursor-pointer select-none hover:bg-[#f8fbff]">
                        <input type="checkbox" id="carry-checkbox" checked onchange="toggleCarry()" class="w-4 h-4 rounded text-[#2563eb] focus:ring-0 cursor-pointer">
                        <span class="text-xs font-bold text-[#334155]">Kotak simpanan</span>
                    </label>
                </div>

                <!-- Sub-Level Khusus Juara: Tingkat 1, Tingkat 2, Tingkat 3 -->
                <div id="juara-tier-bar" class="hidden grid-cols-3 gap-2 p-2 rounded-2xl bg-[#f0f7ff] border border-[#bfdbfe]">
                    <button onclick="setJuaraTier(1)" id="tier-1" class="tier-btn rounded-xl py-1.5 px-2 text-center soft-btn bg-white border border-[#dbeafe]">
                        <div class="text-xs font-bold">⭐ Tingkat 1</div>
                        <div class="text-[10px] text-[#64748b]">Juara Dasar</div>
                    </button>
                    <button onclick="setJuaraTier(2)" id="tier-2" class="tier-btn rounded-xl py-1.5 px-2 text-center soft-btn bg-white border border-[#dbeafe]">
                        <div class="text-xs font-bold">⭐⭐ Tingkat 2</div>
                        <div class="text-[10px] text-[#64748b]">Juara Lanjut</div>
                    </button>
                    <button onclick="setJuaraTier(3)" id="tier-3" class="tier-btn rounded-xl py-1.5 px-2 text-center soft-btn bg-white border border-[#dbeafe]">
                        <div class="text-xs font-bold">⭐⭐⭐ Tingkat 3</div>
                        <div class="text-[10px] text-[#64748b]">Juara Master</div>
                    </button>
                </div>

                <!-- Accordion Panduan Cara Menghitung -->
                <div class="soft-card rounded-2xl overflow-hidden">
                    <button onclick="toggleGuide()" class="w-full px-4 py-2.5 text-left flex items-center justify-between bg-[#eef6ff] hover:bg-[#e0effe] text-[#1d4ed8] font-bold text-xs sm:text-sm transition-colors">
                        <span id="guide-title">▶ Cara menghitung tambah bersusun</span>
                        <span id="guide-arrow" class="text-xs">▼</span>
                    </button>
                    <div id="guide-content" class="hidden p-3.5 text-xs text-[#334155] space-y-1.5 bg-white border-t border-[#dbeafe]">
                        <!-- Diisi secara dinamis -->
                    </div>
                </div>
            </aside>

            <!-- ================= LAYAR SEBELAH KANAN (1 Soal per Layar) ================= -->
            <section class="lg:col-span-7 space-y-3">
                <!-- Kontainer Kartu Soal Aktif -->
                <div id="questions-container" class="w-full"></div>

                <!-- Tombol Aksi Bawah Kartu Soal -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="checkCurrentQuestion()" class="py-3 px-4 rounded-2xl soft-card font-bold text-xs sm:text-sm text-[#1d4ed8] hover:bg-[#eff6ff] flex items-center justify-center gap-1.5 soft-btn">
                        <span>✨</span> Periksa Jawaban
                    </button>
                    <button id="next-question-btn" onclick="nextQuestion()" class="py-3 px-4 rounded-2xl bg-[#2563eb] hover:bg-[#1d4ed8] text-white font-bold text-xs sm:text-sm shadow-sm flex items-center justify-center gap-2 soft-btn">
                        <span>Soal Berikutnya</span>
                        <span>➡️</span>
                    </button>
                </div>
            </section>

        </div>
    </main>

    <!-- Papan Angka Cepat (Sticky di Bawah Layar untuk HP/Tablet/PC) -->
    <div class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-[#dbeafe] shadow-lg px-2.5 py-2">
        <div class="max-w-3xl mx-auto">
            <div class="flex items-center justify-between mb-1.5 px-1">
                <span class="text-[11px] font-bold text-[#475569]">
                    Papan Angka Cepat (Klik kotak lalu tekan angka):
                </span>
                <button onmousedown="event.preventDefault()" onclick="numpadBackspace()" class="text-[11px] font-bold text-[#e11d48] hover:underline flex items-center gap-1 px-2 py-0.5 rounded-lg bg-[#fff1f2]">
                    <span>⌫</span> Hapus Kotak
                </button>
            </div>
            <div class="grid grid-cols-10 gap-1.5">
                <button onmousedown="event.preventDefault()" onclick="numpadPress('1')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">1</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('2')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">2</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('3')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">3</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('4')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">4</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('5')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">5</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('6')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">6</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('7')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">7</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('8')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">8</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('9')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">9</button>
                <button onmousedown="event.preventDefault()" onclick="numpadPress('0')" class="h-10 sm:h-11 rounded-xl bg-[#f8fbff] hover:bg-[#eff6ff] active:bg-[#dbeafe] border border-[#bfdbfe] font-display font-bold text-base sm:text-lg text-[#1e3a8a] soft-btn">0</button>
            </div>
        </div>
    </div>

    <script>
        // ================= STATE UTAMA APLIKASI =================
        const state = {
            gameMode: 'bersusun', // 'bersusun' | 'pecahan'
            operation: 'tambah',  // 'tambah' | 'kurang' | 'kali' | 'bagi' | 'cerita'
            difficulty: 'mudah',  // 'mudah' | 'sedang' | 'sulit'
            juaraTier: 1,         // 1 | 2 | 3 (aktif saat difficulty === 'sulit')
            showCarry: true,
            guideOpen: false,
            soundEnabled: true,
            questionNumber: 1,
            questions: [],        // Menyimpan 1 soal aktif di layar kanan
            statsByKey: {},       // Menyimpan { score, streak } terpisah tiap mode, operasi, & level
            lastFocusedInput: null
        };

        // ================= AUDIO EFEK SUARA =================
        let audioCtx = null;
        function playTone(freq, type = 'sine', duration = 0.14) {
            if (!state.soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) {
                // Abaikan jika browser memblokir autoplay audio
            }
        }

        function playSuccessSound() {
            playTone(523.25, 'sine', 0.12);
            setTimeout(() => playTone(659.25, 'sine', 0.12), 90);
            setTimeout(() => playTone(783.99, 'triangle', 0.22), 180);
        }

        function playErrorSound() {
            playTone(240, 'sawtooth', 0.16);
            setTimeout(() => playTone(190, 'sawtooth', 0.2), 120);
        }

        function toggleSound() {
