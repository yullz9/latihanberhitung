        // ================= UTILITAS ANGKA ACAK =================
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                const t = b;
                b = a % b;
                a = t;
            }
            return a || 1;
        }

        function lcm(a, b) {
            return (a * b) / gcd(a, b);
        }

        // ================= GENERATOR SOAL PECAHAN BIASA =================
        function generateSingleFractionQuestion(index) {
            let actualOp = state.operation;
            if (actualOp === 'cerita') {
                const ops = ['tambah', 'kurang', 'kali', 'bagi'];
                actualOp = ops[randInt(0, ops.length - 1)];
            }

            const diff = state.difficulty;
            const tier = state.juaraTier;
            let givenFractions = [];
            let stepGroups = [];
            let expectedBoxes = [];
            let symbol = '+';

            const pushBox = (val, hint) => {
                const str = String(val);
                const indices = [];
                for (let i = 0; i < str.length; i++) {
                    const idx = expectedBoxes.length;
                    expectedBoxes.push({
                        digit: str[i],
                        hint: `${hint} → Ketik angka ${str[i]}`
                    });
                    indices.push(idx);
                }
                return indices;
            };

            if (actualOp === 'tambah' || actualOp === 'kurang') {
                symbol = actualOp === 'tambah' ? '+' : '−';

                if (diff === 'mudah') {
                    // Penyebut Sama
                    const den = randInt(3, 9);
                    let n1 = randInt(1, den - 1);
                    let n2 = randInt(1, den - 1);
                    if (actualOp === 'kurang' && n1 <= n2) {
                        n1 = randInt(2, den - 1);
                        n2 = randInt(1, n1 - 1);
                    }
                    givenFractions = [{ num: n1, den }, { num: n2, den }];
                    const finalNum = actualOp === 'tambah' ? n1 + n2 : n1 - n2;
                    const numIdx = pushBox(finalNum, `Langkah 1: ${actualOp === 'tambah' ? 'Jumlahkan' : 'Kurangkan'} pembilang atas (${n1} ${symbol} ${n2} = ${finalNum})`);
                    const denIdx = pushBox(den, `Langkah 2: Penyebut tetap ${den}`);
                    stepGroups.push({
                        type: 'final',
                        terms: [{ numBoxes: numIdx, denBoxes: denIdx }]
                    });
                } else if (diff === 'sedang' || (diff === 'sulit' && tier === 1)) {
                    // 2 Pecahan Beda Penyebut
                    const d1 = randInt(2, 6);
                    let d2 = randInt(2, 7);
                    while (d2 === d1) d2 = randInt(2, 7);
                    const commonDen = lcm(d1, d2);
                    let n1 = randInt(1, d1 - 1);
                    let n2 = randInt(1, d2 - 1);

                    let eq1 = n1 * (commonDen / d1);
                    let eq2 = n2 * (commonDen / d2);
                    if (actualOp === 'kurang' && eq1 <= eq2) {
                        [n1, n2] = [n2, n1];
                        [eq1, eq2] = [eq2, eq1];
                        givenFractions = [{ num: n1, den: d2 }, { num: n2, den: d1 }];
                    } else {
                        givenFractions = [{ num: n1, den: d1 }, { num: n2, den: d2 }];
                    }

                    const t1Num = pushBox(eq1, `Langkah 1: Ubah pembilang pecahan ke-1 ke penyebut ${commonDen} (${eq1})`);
                    const t1Den = pushBox(commonDen, `Langkah 2: Tulis penyebut bersama (KPK = ${commonDen})`);
                    const t2Num = pushBox(eq2, `Langkah 3: Ubah pembilang pecahan ke-2 ke penyebut ${commonDen} (${eq2})`);
                    const t2Den = pushBox(commonDen, `Langkah 4: Tulis penyebut bersama (KPK = ${commonDen})`);

                    stepGroups.push({
                        type: 'intermediate',
                        opSymbol: symbol,
                        terms: [
                            { numBoxes: t1Num, denBoxes: t1Den },
                            { numBoxes: t2Num, denBoxes: t2Den }
                        ]
                    });

                    const finalNum = actualOp === 'tambah' ? eq1 + eq2 : eq1 - eq2;
                    const fNum = pushBox(finalNum, `Langkah Akhir: ${eq1} ${symbol} ${eq2} = ${finalNum}`);
                    const fDen = pushBox(commonDen, `Langkah Akhir: Tulis penyebut ${commonDen}`);
                    stepGroups.push({
                        type: 'final',
                        terms: [{ numBoxes: fNum, denBoxes: fDen }]
                    });
                } else {
                    // Juara Tingkat 2 & 3: 3 Pecahan
                    const denSets = tier === 2 ? [[2, 3, 6], [2, 4, 8], [3, 4, 6]] : [[2, 3, 4], [3, 4, 6], [2, 5, 10]];
                    const chosen = denSets[randInt(0, denSets.length - 1)];
                    const [d1, d2, d3] = chosen;
                    const commonDen = lcm(lcm(d1, d2), d3);
                    let n1 = randInt(1, d1 - 1);
                    let n2 = randInt(1, d2 - 1);
                    let n3 = randInt(1, d3 - 1);

                    let eq1 = n1 * (commonDen / d1);
                    let eq2 = n2 * (commonDen / d2);
                    let eq3 = n3 * (commonDen / d3);

                    if (actualOp === 'kurang') {
                        const mult1 = commonDen / d1;
                        const minN1 = Math.floor((eq2 + eq3) / mult1) + 1;
                        n1 = minN1 + randInt(0, 1);
                        eq1 = n1 * mult1;
                    }

                    givenFractions = [
                        { num: n1, den: d1 },
                        { num: n2, den: d2 },
                        { num: n3, den: d3 }
                    ];

                    const t1Num = pushBox(eq1, `Samakan penyebut (${commonDen}): Pembilang ke-1 = ${eq1}`);
                    const t1Den = pushBox(commonDen, `Penyebut ke-1 = ${commonDen}`);
                    const t2Num = pushBox(eq2, `Samakan penyebut (${commonDen}): Pembilang ke-2 = ${eq2}`);
                    const t2Den = pushBox(commonDen, `Penyebut ke-2 = ${commonDen}`);
                    const t3Num = pushBox(eq3, `Samakan penyebut (${commonDen}): Pembilang ke-3 = ${eq3}`);
                    const t3Den = pushBox(commonDen, `Penyebut ke-3 = ${commonDen}`);

                    stepGroups.push({
                        type: 'intermediate',
                        opSymbol: symbol,
                        terms: [
                            { numBoxes: t1Num, denBoxes: t1Den },
                            { numBoxes: t2Num, denBoxes: t2Den },
                            { numBoxes: t3Num, denBoxes: t3Den }
                        ]
                    });

                    const finalNum = actualOp === 'tambah' ? (eq1 + eq2 + eq3) : (eq1 - eq2 - eq3);
                    const fNum = pushBox(finalNum, `Langkah Akhir: ${eq1} ${symbol} ${eq2} ${symbol} ${eq3} = ${finalNum}`);
                    const fDen = pushBox(commonDen, `Langkah Akhir: Tulis penyebut ${commonDen}`);
                    stepGroups.push({
                        type: 'final',
                        terms: [{ numBoxes: fNum, denBoxes: fDen }]
                    });
                }
            } else if (actualOp === 'kali') {
                symbol = '×';
                const maxDen = diff === 'mudah' ? 5 : (diff === 'sedang' ? 8 : 9);
                const d1 = randInt(2, maxDen);
                const d2 = randInt(2, maxDen);
                const n1 = randInt(1, d1 - 1);
                const n2 = randInt(1, d2 - 1);
                givenFractions = [{ num: n1, den: d1 }, { num: n2, den: d2 }];

                const prodNum = n1 * n2;
                const prodDen = d1 * d2;
                const fNum = pushBox(prodNum, `Langkah 1: Kalikan pembilang atas (${n1} × ${n2} = ${prodNum})`);
                const fDen = pushBox(prodDen, `Langkah 2: Kalikan penyebut bawah (${d1} × ${d2} = ${prodDen})`);
                stepGroups.push({
                    type: 'final',
                    terms: [{ numBoxes: fNum, denBoxes: fDen }]
                });
            } else if (actualOp === 'bagi') {
                symbol = ':';
                const maxDen = diff === 'mudah' ? 5 : (diff === 'sedang' ? 8 : 9);
                const d1 = randInt(2, maxDen);
                const d2 = randInt(2, maxDen);
                const n1 = randInt(1, d1 - 1);
                const n2 = randInt(1, d2 - 1);
                givenFractions = [{ num: n1, den: d1 }, { num: n2, den: d2 }];

                const flipNum = pushBox(d2, `Langkah 1: Balik pecahan kedua (${n2}/${d2} menjadi ${d2}/${n2}) → Tulis ${d2} di atas`);
                const flipDen = pushBox(n2, `Langkah 2: Tulis ${n2} di penyebut bawah`);
                stepGroups.push({
                    type: 'intermediate_divide',
                    firstFrac: { num: n1, den: d1 },
                    flippedTerm: { numBoxes: flipNum, denBoxes: flipDen }
                });

                const prodNum = n1 * d2;
                const prodDen = d1 * n2;
                const fNum = pushBox(prodNum, `Langkah 3: Kalikan pembilang (${n1} × ${d2} = ${prodNum})`);
                const fDen = pushBox(prodDen, `Langkah 4: Kalikan penyebut (${d1} × ${n2} = ${prodDen})`);
                stepGroups.push({
                    type: 'final',
                    terms: [{ numBoxes: fNum, denBoxes: fDen }]
                });
            }

            const titleExpr = givenFractions.map(f => `${f.num}/${f.den}`).join(` ${symbol} `);
            let storyText = null;
            if (state.operation === 'cerita') {
                const fStr = givenFractions.map(f => `<strong>${f.num}/${f.den}</strong>`).join(' dan ');
                if (actualOp === 'tambah') {
                    storyText = `Ibu memiliki pita sepanjang ${fStr} meter. Berapa meter total panjang pita Ibu jika digabungkan semuanya?`;
                } else if (actualOp === 'kurang') {
                    storyText = `Persediaan susu di kulkas ada <strong>${givenFractions[0].num}/${givenFractions[0].den}</strong> liter, kemudian diminum sebanyak ${givenFractions.slice(1).map(f => `<strong>${f.num}/${f.den}</strong>`).join(' dan ')} liter. Berapa liter sisa susu sekarang?`;
                } else if (actualOp === 'kali') {
                    storyText = `Sebuah resep kue membutuhkan <strong>${givenFractions[0].num}/${givenFractions[0].den}</strong> kg tepung. Jika Rina hanya membuat <strong>${givenFractions[1].num}/${givenFractions[1].den}</strong> bagian dari resep tersebut, berapa kg tepung yang dipakai?`;
                } else {
                    storyText = `Tersedia <strong>${givenFractions[0].num}/${givenFractions[0].den}</strong> liter madu yang akan dituang ke dalam botol-botol kecil berukuran <strong>${givenFractions[1].num}/${givenFractions[1].den}</strong> liter. Berapa bagian botol yang terisi?`;
                }
            }

            return {
                id: index,
                isFraction: true,
                actualOp,
                symbol,
                titleText: titleExpr,
                storyText,
                opGuessed: state.operation !== 'cerita',
                solved: false,
                fracData: {
                    givenFractions,
                    symbol,
                    stepGroups,
                    expectedBoxes
                }
            };
        }

        // ================= DATA POROGAPIT (PEMBAGIAN BERSUSUN KE BAWAH) =================
        function buildDivisionData(num1, num2) {
            const dividendDigits = String(num1).split('').map(Number);
            const n = dividendDigits.length;
            const quotientBoxes = [];
            const steps = [];
            const expectedBoxes = [];

            let idx = 0;
            let currentVal = dividendDigits[0];
            if (currentVal < num2 && n > 1) {
                idx = 1;
                currentVal = dividendDigits[0] * 10 + dividendDigits[1];
            }

            while (idx < n) {
                const qDigit = Math.floor(currentVal / num2);
                const product = qDigit * num2;
                const remainder = currentVal - product;

                const qBoxIndex = expectedBoxes.length;
                expectedBoxes.push({
                    digit: String(qDigit),
                    hint: `Langkah: ${currentVal} : ${num2} = ${qDigit} (Tulis hasil bagi di kotak hijau atas)`
                });
                quotientBoxes.push({ col: idx, boxIndex: qBoxIndex });

                // Digit produk pengurang
                const prodStr = String(product);
                const prodBoxes = [];
                const prodStartCol = idx - prodStr.length + 1;
                for (let k = 0; k < prodStr.length; k++) {
                    const pBoxIdx = expectedBoxes.length;
                    expectedBoxes.push({
                        digit: prodStr[k],
                        hint: `Langkah: Kalikan ${qDigit} × ${num2} = ${product} (Tulis di bawah untuk dikurangkan)`
                    });
                    prodBoxes.push({ col: prodStartCol + k, boxIndex: pBoxIdx });
                }

                const hasNext = idx + 1 < n;
                const bringDownBoxes = [];
                let nextVal = remainder;

                if (hasNext) {
                    const nextDigit = dividendDigits[idx + 1];
                    nextVal = remainder * 10 + nextDigit;
                    const remStr = remainder > 0 ? String(remainder) : '';
                    const combinedStr = remStr + String(nextDigit);
                    const startCol = (idx + 1) - combinedStr.length + 1;

                    for (let k = 0; k < combinedStr.length; k++) {
                        const bIdx = expectedBoxes.length;
                        const isLastBrought = k === combinedStr.length - 1;
                        expectedBoxes.push({
                            digit: combinedStr[k],
                            hint: isLastBrought
                                ? `Langkah: Turunkan angka ${nextDigit} ke bawah menjadi ${combinedStr}`
                                : `Langkah: Kurangkan ${currentVal} − ${product} = ${remainder}`
                        });
                        bringDownBoxes.push({
                            col: startCol + k,
                            boxIndex: bIdx,
                            arrowFromAbove: isLastBrought
                        });
                    }
                } else {
                    const fIdx = expectedBoxes.length;
                    expectedBoxes.push({
                        digit: String(remainder),
                        hint: `Langkah Akhir: ${currentVal} − ${product} = 0 (Pembagian habis)`
                    });
                    bringDownBoxes.push({ col: idx, boxIndex: fIdx, arrowFromAbove: false });
                }

                steps.push({
                    prodBoxes,
                    bringDownBoxes,
                    lineStartCol: Math.min(prodStartCol, bringDownBoxes[0].col),
                    lineEndCol: hasNext ? idx + 1 : idx
                });

                currentVal = nextVal;
                idx++;
            }

            return {
                dividendDigits,
                divisor: num2,
                quotientBoxes,
                steps,
                expectedBoxes
            };
        }

        // ================= DATA PERKALIAN BERSUSUN BANYAK BARIS (LEVEL JUARA) =================
        function buildMultiRowMultiplyData(num1, num2) {
            const multDigits = String(num2).split('').map(Number).reverse(); // Dari satuan ke kiri
            const totalAnswer = num1 * num2;
            const totalCols = String(totalAnswer).length;
            const partialRows = [];
            const expectedBoxes = [];

            multDigits.forEach((d, rowIdx) => {
                const partVal = num1 * d;
                const partStr = String(partVal);
                const rowBoxes = [];
                // Isi dari kanan ke kiri pada baris ini
                for (let i = partStr.length - 1; i >= 0; i--) {
                    const colFromRight = (partStr.length - 1 - i) + rowIdx;
                    const colIndex = totalCols - 1 - colFromRight;
                    const bIdx = expectedBoxes.length;
                    expectedBoxes.push({
                        digit: partStr[i],
                        hint: `Baris ${rowIdx + 1}: Kalikan ${num1} × ${d} = ${partVal} (Isi dari kanan ke kiri)`
                    });
                    rowBoxes.push({ col: colIndex, boxIndex: bIdx });
                }
                partialRows.push({
                    shiftRightDots: rowIdx,
                    boxesByCol: rowBoxes
                });
            });

            const finalStr = String(totalAnswer);
            const finalBoxesByCol = [];
            for (let i = finalStr.length - 1; i >= 0; i--) {
                const bIdx = expectedBoxes.length;
                expectedBoxes.push({
                    digit: finalStr[i],
                    hint: `Langkah Akhir: Jumlahkan seluruh baris hasil kali di atas dari kanan ke kiri`
                });
                finalBoxesByCol.push({ col: i, boxIndex: bIdx });
            }

            return {
                num1,
                num2,
                totalCols,
                partialRows,
                finalBoxesByCol,
                expectedBoxes
            };
        }

        // ================= GENERATOR SOAL BERHITUNG BERSUSUN =================
        function generateSingleQuestion(index) {
            if (state.gameMode === 'pecahan') {
                return generateSingleFractionQuestion(index);
            }

            let actualOp = state.operation;
            if (actualOp === 'cerita') {
                const ops = ['tambah', 'kurang', 'kali', 'bagi'];
                actualOp = ops[randInt(0, ops.length - 1)];
            }

            const diff = state.difficulty;
            const tier = state.juaraTier;
            let numbers = [];
            let answer = 0;
            let symbol = '+';
            let multiMultiplyData = null;
            let divisionData = null;

            if (actualOp === 'tambah') {
                symbol = '+';
                if (diff === 'mudah') {
                    numbers = [randInt(12, 68), randInt(11, 59)];
                } else if (diff === 'sedang') {
                    numbers = [randInt(125, 589), randInt(118, 479)];
                } else {
                    // Level Juara: Penjumlahan Lapis 3 Susun
                    if (tier === 1) {
                        numbers = [randInt(124, 468), randInt(115, 389), randInt(108, 295)];
                    } else if (tier === 2) {
                        numbers = [randInt(1120, 3450), randInt(1045, 2890), randInt(950, 2450)];
                    } else {
                        numbers = [randInt(2450, 5890), randInt(1875, 4680), randInt(1560, 3980)];
                    }
                }
                answer = numbers.reduce((a, b) => a + b, 0);
            } else if (actualOp === 'kurang') {
                symbol = '−';
                if (diff === 'mudah') {
                    const b = randInt(11, 45);
                    const a = b + randInt(12, 48);
                    numbers = [a, b];
                } else if (diff === 'sedang') {
                    // 1 atau 2 kali meminjam
                    const u1 = randInt(1, 5), u2 = randInt(u1 + 1, 9);
                    const t1 = randInt(5, 8), t2 = randInt(1, t1 - 1);
                    const h1 = randInt(4, 8), h2 = randInt(1, h1 - 1);
                    numbers = [h1 * 100 + t1 * 10 + u1, h2 * 100 + t2 * 10 + u2];
                } else {
                    // Level Juara: Lebih Banyak Meminjam di Setiap Kolom
                    if (tier === 1) {
                        const u1 = randInt(1, 5), u2 = randInt(u1 + 1, 9);
                        const t1 = randInt(1, 5), t2 = randInt(t1 + 1, 8);
                        const h1 = randInt(5, 9), h2 = randInt(1, h1 - 2);
                        numbers = [h1 * 100 + t1 * 10 + u1, h2 * 100 + t2 * 10 + u2];
                    } else if (tier === 2) {
                        const u1 = randInt(1, 5), u2 = randInt(u1 + 1, 9);
                        const t1 = randInt(1, 5), t2 = randInt(t1 + 1, 8);
                        const h1 = randInt(1, 5), h2 = randInt(h1 + 1, 8);
                        const th1 = randInt(5, 9), th2 = randInt(1, th1 - 2);
                        numbers = [
                            th1 * 1000 + h1 * 100 + t1 * 10 + u1,
                            th2 * 1000 + h2 * 100 + t2 * 10 + u2
                        ];
                    } else {
                        // Tingkat 3: Meminjam melewati angka 0
                        const th1 = randInt(5, 9), th2 = randInt(1, th1 - 2);
                        const u1 = randInt(1, 5), u2 = randInt(u1 + 1, 9);
                        const t2 = randInt(3, 8), h2 = randInt(3, 8);
                        numbers = [
                            th1 * 1000 + u1,
                            th2 * 1000 + h2 * 100 + t2 * 10 + u2
                        ];
                    }
                }
                answer = numbers[0] - numbers[1];
            } else if (actualOp === 'kali') {
                symbol = '×';
                if (diff === 'mudah') {
                    numbers = [randInt(12, 34), randInt(2, 5)];
                    answer = numbers[0] * numbers[1];
                } else if (diff === 'sedang') {
                    numbers = [randInt(36, 148), randInt(4, 8)];
                    answer = numbers[0] * numbers[1];
                } else {
                    // Level Juara: Perkalian Puluhan & Ratusan Bersusun
                    if (tier === 1) {
                        numbers = [randInt(23, 68), randInt(12, 36)];
                    } else if (tier === 2) {
                        numbers = [randInt(115, 345), randInt(14, 46)];
                    } else {
                        numbers = [randInt(112, 265), randInt(112, 234)];
                    }
                    answer = numbers[0] * numbers[1];
                    multiMultiplyData = buildMultiRowMultiplyData(numbers[0], numbers[1]);
                }
            } else if (actualOp === 'bagi') {
                symbol = ':';
                if (diff === 'mudah') {
                    const divisor = randInt(2, 5);
                    const quotient = randInt(12, 29);
                    numbers = [divisor * quotient, divisor];
                    answer = quotient;
                } else if (diff === 'sedang') {
                    const divisor = randInt(4, 8);
                    const quotient = randInt(32, 128);
                    numbers = [divisor * quotient, divisor];
                    answer = quotient;
                } else {
                    // Level Juara: Pembagian Puluhan
                    let divisor, quotient;
                    if (tier === 1) {
                        divisor = randInt(11, 18);
                        quotient = randInt(12, 34);
                    } else if (tier === 2) {
                        divisor = randInt(14, 26);
                        quotient = randInt(35, 89);
                    } else {
                        divisor = randInt(21, 45);
                        quotient = randInt(112, 248);
                    }
                    numbers = [divisor * quotient, divisor];
                    answer = quotient;
                }
                divisionData = buildDivisionData(numbers[0], numbers[1]);
            }

            // Hitung posisi kolom yang membutuhkan kotak simpanan (untuk Tambah & Kali 1 baris)
            const totalCols = String(answer).length;
            const carryCols = new Array(totalCols).fill(false);

            if ((actualOp === 'tambah' || actualOp === 'kali') && !multiMultiplyData) {
                for (let c = 0; c < totalCols - 1; c++) {
                    carryCols[c] = true;
                }
            }

            let storyText = null;
            if (state.operation === 'cerita') {
                if (actualOp === 'tambah') {
                    if (numbers.length === 3) {
                        storyText = `Perpustakaan sekolah menerima sumbangan buku dalam 3 tahap: <strong>${numbers[0]}</strong> buku, <strong>${numbers[1]}</strong> buku, dan <strong>${numbers[2]}</strong> buku. Berapa jumlah seluruh buku yang diterima?`;
                    } else {
                        storyText = `Di kebun Pak Budi dipanen <strong>${numbers[0]}</strong> buah jeruk pada pagi hari dan <strong>${numbers[1]}</strong> buah jeruk pada sore hari. Berapa jumlah seluruh jeruk yang dipanen?`;
                    }
                } else if (actualOp === 'kurang') {
                    storyText = `Sebuah toko roti membuat <strong>${numbers[0]}</strong> potong roti. Siang ini telah terjual sebanyak <strong>${numbers[1]}</strong> potong roti. Berapa potong roti yang masih tersisa?`;
                } else if (actualOp === 'kali') {
                    storyText = `Panitia menyiapkan <strong>${numbers[1]}</strong> kotak perlengkapan sekolah. Setiap kotak berisi <strong>${numbers[0]}</strong> buku tulis. Berapa total seluruh buku tulis yang disiapkan?`;
                } else {
                    storyText = `Sebanyak <strong>${numbers[0]}</strong> bibit tanaman akan dibagikan sama rata ke <strong>${numbers[1]}</strong> kelompok tani. Berapa bibit tanaman yang diterima setiap kelompok?`;
                }
            }

            return {
                id: index,
                isFraction: false,
                actualOp,
                symbol,
                numbers,
                answer,
                totalCols,
                carryCols,
                titleText: numbers.join(` ${symbol} `),
                storyText,
                opGuessed: state.operation !== 'cerita',
                solved: false,
                multiMultiplyData,
                divisionData
            };
        }

        function generateAllQuestions() {
            state.questions = [generateSingleQuestion(0)];
            renderQuestions();
        }

        function generateNewSet() {
            playTone(440, 'sine', 0.08);
            state.questionNumber = 1;
            generateAllQuestions();
        }

        function nextQuestion() {
            playTone(520, 'sine', 0.09);
            state.questionNumber += 1;
            generateAllQuestions();
        }

        // ================= RENDER KARTU PECAHAN BIASA (TANDA = LURUS KE BAWAH) =================
        function renderStaticFraction(num, den) {
            return `
                <div class="inline-flex flex-col items-center mx-1.5 select-none">
                    <div class="font-display font-bold text-2xl text-[#1e293b] px-2 pb-0.5 leading-tight">${num}</div>
                    <div class="w-full h-[2.5px] bg-[#60a5fa] rounded-full"></div>
                    <div class="font-display font-bold text-2xl text-[#1e293b] px-2 pt-0.5 leading-tight">${den}</div>
                </div>
            `;
        }

        function renderFractionTermBoxes(qIndex, term, expectedBoxes, isFinal) {
            const boxClass = isFinal ? 'digit-box quotient-box' : 'digit-box';

            const renderRowBoxes = (indices) => indices.map(bIdx => {
                const hint = expectedBoxes[bIdx] ? expectedBoxes[bIdx].hint : '';
                return `
                    <div class="relative inline-flex mx-0.5">
                        <span class="absolute -top-2 -left-1.5 w-4 h-4 rounded-full bg-[#2563eb] text-white text-[10px] font-bold flex items-center justify-center shadow-sm z-10 select-none">${bIdx + 1}</span>
                        <input
                            type="text"
                            inputmode="none"
                            maxlength="1"
                            data-q="${qIndex}"
                            data-col="${bIdx}"
                            data-hint="${hint.replace(/"/g, '&quot;')}"
                            onfocus="updateFracHint(${qIndex}, this.dataset.hint)"
                            class="${boxClass} answer-input-${qIndex}"
                        />
                    </div>
                `;
            }).join('');

            return `
                <div class="inline-flex flex-col items-center mx-1.5">
                    <div class="flex items-center justify-center pb-1.5">
                        ${renderRowBoxes(term.numBoxes)}
                    </div>
                    <div class="w-full h-[2.5px] bg-[#60a5fa] rounded-full"></div>
                    <div class="flex items-center justify-center pt-1.5">
                        ${renderRowBoxes(term.denBoxes)}
                    </div>
                </div>
            `;
        }

        function renderFractionCard(q, qIndex) {
            const f = q.fracData;
            const firstHint = f.expectedBoxes[0] ? f.expectedBoxes[0].hint : '';

            const givenHtml = f.givenFractions.map((fr, idx) => {
                const opHtml = idx > 0
                    ? `<div class="px-1.5 font-bold text-2xl text-[#2563eb] select-none">${f.symbol}</div>`
                    : '';
                return `${opHtml}${renderStaticFraction(fr.num, fr.den)}`;
            }).join('');

            const renderGroupContent = (group) => {
                if (group.type === 'intermediate') {
                    return group.terms.map((t, idx) => {
                        const op = idx > 0
                            ? `<div class="px-1 font-bold text-2xl text-[#2563eb] select-none">${group.opSymbol}</div>`
                            : '';
                        return `${op}${renderFractionTermBoxes(qIndex, t, f.expectedBoxes, false)}`;
                    }).join('');
                } else if (group.type === 'intermediate_divide') {
                    return `
                        ${renderStaticFraction(group.firstFrac.num, group.firstFrac.den)}
                        <div class="px-1.5 font-bold text-2xl text-[#059669] select-none">×</div>
                        ${renderFractionTermBoxes(qIndex, group.flippedTerm, f.expectedBoxes, false)}
                    `;
                } else if (group.type === 'final') {
                    return renderFractionTermBoxes(qIndex, group.terms[0], f.expectedBoxes, true);
                }
                return '';
            };

            let stepsRowsHtml = '';
            for (let i = 0; i < f.stepGroups.length; i++) {
                const stepHtml = renderGroupContent(f.stepGroups[i]);
                stepsRowsHtml += `
                    <tr class="align-middle">
                        <td class="pr-2 py-1.5 font-display font-bold text-2xl text-[#2563eb] select-none text-center align-middle">=</td>
                        <td class="py-1.5 align-middle">
                            <div class="inline-flex items-center">
                                ${stepHtml}
                            </div>
                        </td>
                    </tr>
                `;
            }

            const verticalRowsHtml = `
                <table class="border-collapse">
                    <tbody>
                        <tr class="align-middle">
                            <td class="pr-2 py-1.5"></td>
                            <td class="py-1.5 align-middle">
                                <div class="inline-flex items-center">
                                    ${givenHtml}
                                </div>
                            </td>
                        </tr>
                        ${stepsRowsHtml}
                    </tbody>
                </table>
            `;

            return `
                <div class="flex flex-col items-center w-full">
                    <div id="frac-hint-${qIndex}" class="mb-2.5 px-3.5 py-2 rounded-xl bg-[#eef6ff] border border-[#bfdbfe] text-[#1e3a8a] text-xs font-medium text-center max-w-md">
                        💡 ${firstHint}
                    </div>
                    <div class="flex justify-center py-0.5">
                        ${verticalRowsHtml}
                    </div>
                </div>
            `;
        }

        function updateFracHint(qIndex, hintText) {
            const el = document.getElementById(`frac-hint-${qIndex}`);
            if (el && hintText) {
                el.innerHTML = `💡 ${hintText}`;
            }
        }

        // ================= RENDER POROGAPIT (PEMBAGIAN BERSUSUN) =================
        function renderDivisionCard(q, qIndex) {
            const d = q.divisionData;
            const nCols = d.dividendDigits.length;
            const firstHint = d.expectedBoxes[0] ? d.expectedBoxes[0].hint : '';

            // Baris Hasil Bagi di Atas
            let quotientCells = `<td class="w-12"></td><td class="w-4"></td>`;
            for (let c = 0; c < nCols; c++) {
                const foundQ = d.quotientBoxes.find(qb => qb.col === c);
                if (foundQ) {
                    const bIdx = foundQ.boxIndex;
                    const hint = d.expectedBoxes[bIdx].hint;
                    quotientCells += `
                        <td class="p-1 text-center">
                            <div class="relative inline-flex">
                                <span class="absolute -top-2 -left-1.5 w-4 h-4 rounded-full bg-[#2563eb] text-white text-[10px] font-bold flex items-center justify-center shadow-sm z-10">${bIdx + 1}</span>
                                <input type="text" inputmode="none" maxlength="1"
                                    data-q="${qIndex}" data-col="${bIdx}"
                                    data-hint="${hint.replace(/"/g, '&quot;')}"
                                    onfocus="updateDivHint(${qIndex}, this.dataset.hint)"
                                    class="digit-box quotient-box answer-input-${qIndex}" />
                            </div>
                        </td>
                    `;
                } else {
                    quotientCells += `<td class="w-11 p-1"></td>`;
                }
            }

            // Baris Angka yang Dibagi
            let dividendCells = `
                <td class="pr-1 text-right font-display font-bold text-2xl text-[#1d4ed8] select-none">${d.divisor}</td>
                <td class="text-center font-display font-bold text-3xl text-[#60a5fa] select-none leading-none">/</td>
            `;
            for (let c = 0; c < nCols; c++) {
                dividendCells += `
                    <td class="w-11 py-1.5 text-center font-display font-bold text-2xl text-[#1e293b] border-t-[3px] border-[#60a5fa] select-none">
                        ${d.dividendDigits[c]}
                    </td>
                `;
            }

            // Langkah-langkah Pengurangan ke Bawah
            let stepsHtml = '';
            d.steps.forEach(st => {
                // Baris Pengurang (-)
                let prodRowCells = `<td class="w-12"></td><td class="w-4"></td>`;
                const firstProdCol = st.prodBoxes[0].col;
                for (let c = 0; c < nCols; c++) {
                    const foundP = st.prodBoxes.find(pb => pb.col === c);
                    const minusSign = c === firstProdCol
                        ? `<span class="absolute -left-3.5 top-1/2 -translate-y-1/2 font-bold text-xl text-[#2563eb] select-none">−</span>`
                        : '';
                    if (foundP) {
                        const bIdx = foundP.boxIndex;
                        const hint = d.expectedBoxes[bIdx].hint;
                        prodRowCells += `
                            <td class="p-1 text-center border-b-[2.5px] border-[#93c5fd] relative">
                                ${minusSign}
                                <div class="relative inline-flex">
                                    <span class="absolute -top-2 -left-1.5 w-4 h-4 rounded-full bg-[#2563eb] text-white text-[10px] font-bold flex items-center justify-center shadow-sm z-10">${bIdx + 1}</span>
                                    <input type="text" inputmode="none" maxlength="1"
                                        data-q="${qIndex}" data-col="${bIdx}"
                                        data-hint="${hint.replace(/"/g, '&quot;')}"
                                        onfocus="updateDivHint(${qIndex}, this.dataset.hint)"
                                        class="digit-box answer-input-${qIndex}" />
                                </div>
                            </td>
                        `;
                    } else {
                        const borderClass = (c >= st.lineStartCol && c <= st.lineEndCol) ? 'border-b-[2.5px] border-[#93c5fd]' : '';
                        prodRowCells += `<td class="w-11 p-1 ${borderClass}"></td>`;
                    }
                }
                stepsHtml += `<tr>${prodRowCells}</tr>`;

                // Baris Hasil Kurang & Angka Turun (↓)
                let bringRowCells = `<td class="w-12"></td><td class="w-4"></td>`;
                for (let c = 0; c < nCols; c++) {
                    const foundB = st.bringDownBoxes.find(bb => bb.col === c);
                    if (foundB) {
                        const bIdx = foundB.boxIndex;
                        const hint = d.expectedBoxes[bIdx].hint;
                        const arrowHtml = foundB.arrowFromAbove
                            ? `<div class="text-[11px] font-bold text-[#3b82f6] leading-none mb-0.5 select-none">↓</div>`
                            : `<div class="h-3"></div>`;
                        bringRowCells += `
                            <td class="p-1 text-center align-bottom">
                                ${arrowHtml}
                                <div class="relative inline-flex">
                                    <span class="absolute -top-2 -left-1.5 w-4 h-4 rounded-full bg-[#2563eb] text-white text-[10px] font-bold flex items-center justify-center shadow-sm z-10">${bIdx + 1}</span>
                                    <input type="text" inputmode="none" maxlength="1"
                                        data-q="${qIndex}" data-col="${bIdx}"
                                        data-hint="${hint.replace(/"/g, '&quot;')}"
                                        onfocus="updateDivHint(${qIndex}, this.dataset.hint)"
                                        class="digit-box answer-input-${qIndex}" />
                                </div>
                            </td>
                        `;
                    } else {
                        bringRowCells += `<td class="w-11 p-1"></td>`;
                    }
                }
                stepsHtml += `<tr>${bringRowCells}</tr>`;
            });

            return `
                <div class="flex flex-col items-center w-full">
                    <div id="div-hint-${qIndex}" class="mb-2.5 px-3.5 py-2 rounded-xl bg-[#eef6ff] border border-[#bfdbfe] text-[#1e3a8a] text-xs font-medium text-center max-w-md">
                        💡 ${firstHint}
                    </div>
                    <table class="border-collapse">
                        <tbody>
                            <tr>${quotientCells}</tr>
                            <tr>${dividendCells}</tr>
                            ${stepsHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function updateDivHint(qIndex, hintText) {
            const el = document.getElementById(`div-hint-${qIndex}`);
            if (el && hintText) {
                el.innerHTML = `💡 ${hintText}`;
            }
        }

        // ================= RENDER PERKALIAN BERSUSUN BERTINGKAT (JUARA) =================
        function renderMultiRowMultiplyCard(q, qIndex) {
            const m = q.multiMultiplyData;
            const totalCols = m.totalCols;
            const n1Digits = String(m.num1).padStart(totalCols, ' ').split('');
            const n2Digits = String(m.num2).padStart(totalCols, ' ').split('');
            const firstHint = m.expectedBoxes[0] ? m.expectedBoxes[0].hint : '';

            const renderStaticRow = (digits, opSymbol = '') => {
                const cells = digits.map(ch => `
                    <div class="w-11 h-10 flex items-center justify-center font-display font-bold text-2xl text-[#1e293b] select-none">
                        ${ch === ' ' ? '' : ch}
                    </div>
                `).join('');
                return `
                    <div class="flex items-center justify-end gap-1.5">
                        <div class="w-6 text-center font-display font-bold text-2xl text-[#2563eb] select-none">${opSymbol}</div>
                        ${cells}
                    </div>
                `;
            };

            let partialRowsHtml = '';
            m.partialRows.forEach((pRow, rIdx) => {
                let rowCells = '';
                for (let c = 0; c < totalCols; c++) {
                    const found = pRow.boxesByCol.find(b => b.col === c);
                    const isDotCol = c >= totalCols - pRow.shiftRightDots;
                    if (found) {
                        const bIdx = found.boxIndex;
                        const hint = m.expectedBoxes[bIdx].hint;
                        rowCells += `
                            <div class="w-11 flex justify-center">
                                <input type="text" inputmode="none" maxlength="1"
                                    data-q="${qIndex}" data-col="${bIdx}"
                                    data-hint="${hint.replace(/"/g, '&quot;')}"
                                    onfocus="updateMultHint(${qIndex}, this.dataset.hint)"
                                    class="digit-box answer-input-${qIndex}" />
                            </div>
                        `;
                    } else if (isDotCol) {
                        rowCells += `<div class="w-11 h-11 flex items-center justify-center font-bold text-slate-300 select-none">·</div>`;
                    } else {
                        rowCells += `<div class="w-11 h-11"></div>`;
                    }
                }
                const plusSign = rIdx === m.partialRows.length - 1 ? '+' : '';
                partialRowsHtml += `
                    <div class="flex items-center justify-end gap-1.5 my-1">
                        <div class="w-6 text-center font-display font-bold text-2xl text-[#2563eb] select-none">${plusSign}</div>
                        ${rowCells}
                    </div>
                `;
            });

            let finalRowCells = '';
            for (let c = 0; c < totalCols; c++) {
                const found = m.finalBoxesByCol.find(b => b.col === c);
                if (found) {
                    const bIdx = found.boxIndex;
                    const hint = m.expectedBoxes[bIdx].hint;
                    finalRowCells += `
                        <div class="w-11 flex justify-center">
                            <input type="text" inputmode="none" maxlength="1"
                                data-q="${qIndex}" data-col="${bIdx}"
                                data-hint="${hint.replace(/"/g, '&quot;')}"
                                onfocus="updateMultHint(${qIndex}, this.dataset.hint)"
                                class="digit-box quotient-box answer-input-${qIndex}" />
                        </div>
                    `;
                }
            }

            return `
                <div class="flex flex-col items-center w-full">
                    <div id="mult-hint-${qIndex}" class="mb-2.5 px-3.5 py-2 rounded-xl bg-[#eef6ff] border border-[#bfdbfe] text-[#1e3a8a] text-xs font-medium text-center max-w-md">
                        💡 ${firstHint}
                    </div>
                    <div class="inline-flex flex-col">
                        ${renderStaticRow(n1Digits, '')}
                        ${renderStaticRow(n2Digits, '×')}
                        <div class="border-b-[2.5px] border-[#60a5fa] my-1.5 ml-7"></div>
                        ${partialRowsHtml}
                        <div class="border-b-[2.5px] border-[#60a5fa] my-1.5 ml-7"></div>
                        <div class="flex items-center justify-end gap-1.5 mt-1">
                            <div class="w-6"></div>
                            ${finalRowCells}
                        </div>
                    </div>
                </div>
            `;
        }

        function updateMultHint(qIndex, hintText) {
            const el = document.getElementById(`mult-hint-${qIndex}`);
            if (el && hintText) {
                el.innerHTML = `💡 ${hintText}`;
            }
        }

        // ================= RENDER UTAMA KARTU SOAL =================
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            state.questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.id = `qcard-${qIndex}`;
                card.className = 'soft-card rounded-3xl p-4 sm:p-5 transition-all animate-pop';

                // Pilihan Operasi untuk Soal Cerita (Sebelum Langkah Kerja Terbuka)
                let storyPickerHtml = '';
                if (q.storyText && !q.opGuessed) {
                    storyPickerHtml = `
                        <div id="story-picker-${qIndex}" class="my-3 p-3.5 rounded-2xl bg-[#f0f7ff] border border-[#bfdbfe] text-center">
                            <p class="text-xs font-bold text-[#1e3a8a] mb-2.5">
                                🤔 Pilih operasi hitung yang tepat untuk menyelesaikan cerita di atas:
                            </p>
                            <div class="grid grid-cols-4 gap-2 max-w-sm mx-auto">
                                <button onclick="guessStoryOp(${qIndex}, 'tambah', this)" class="py-2 px-2 rounded-xl bg-white hover:bg-[#dbeafe] border border-[#93c5fd] font-bold text-xs text-[#1d4ed8] soft-btn">+ Tambah</button>
                                <button onclick="guessStoryOp(${qIndex}, 'kurang', this)" class="py-2 px-2 rounded-xl bg-white hover:bg-[#ffe4e6] border border-[#fda4af] font-bold text-xs text-[#be123c] soft-btn">− Kurang</button>
                                <button onclick="guessStoryOp(${qIndex}, 'kali', this)" class="py-2 px-2 rounded-xl bg-white hover:bg-[#d1fae5] border border-[#6ee7b7] font-bold text-xs text-[#047857] soft-btn">× Kali</button>
                                <button onclick="guessStoryOp(${qIndex}, 'bagi', this)" class="py-2 px-2 rounded-xl bg-white hover:bg-[#e0f2fe] border border-[#7dd3fc] font-bold text-xs text-[#0369a1] soft-btn">: Bagi</button>
                            </div>
                            <p id="story-feedback-${qIndex}" class="text-[11px] font-semibold text-[#e11d48] mt-2 hidden"></p>
                        </div>
                    `;
                }

                let innerMathHtml = '';
                if (q.isFraction) {
                    innerMathHtml = renderFractionCard(q, qIndex);
                } else if (q.actualOp === 'bagi') {
                    innerMathHtml = renderDivisionCard(q, qIndex);
                } else if (q.multiMultiplyData) {
                    innerMathHtml = renderMultiRowMultiplyCard(q, qIndex);
                } else {
                    // Penjumlahan, Pengurangan, & Perkalian 1 Baris Standar
                    const totalCols = q.totalCols;
                    const hasCarryFeature = (q.actualOp === 'tambah' || q.actualOp === 'kali');

                    let carryCellsHtml = '';
                    if (hasCarryFeature) {
                        for (let c = 0; c < totalCols; c++) {
                            if (q.carryCols[c]) {
                                carryCellsHtml += `
                                    <div class="w-11 flex justify-center">
                                        <input type="text" inputmode="none" maxlength="1"
                                            data-q="${qIndex}" data-carry-col="${c}"
                                            class="carry-box carry-input-${qIndex}" />
                                    </div>
                                `;
                            } else {
                                carryCellsHtml += `<div class="w-11 h-8"></div>`;
                            }
                        }
                    }

                    const carryVisibility = (hasCarryFeature && state.showCarry) ? 'mb-1.5' : 'invisible h-0 mb-0';
                    const carryRowHtml = hasCarryFeature ? `
                        <div class="carry-row-container flex items-center justify-end gap-1.5 ${carryVisibility}">
                            <div class="w-6"></div>
                            ${carryCellsHtml}
                        </div>
                    ` : '';

                    // Baris angka yang dihitung (mendukung 2 lapis maupun 3 lapis)
                    const numberRowsHtml = q.numbers.map((num, nIdx) => {
                        const digits = String(num).padStart(totalCols, ' ').split('');
                        const opChar = nIdx === q.numbers.length - 1 ? q.symbol : '';
                        const cells = digits.map(d => `
                            <div class="w-11 h-10 flex items-center justify-center font-display font-bold text-2xl sm:text-3xl text-[#1e293b] select-none">
                                ${d === ' ' ? '' : d}
                            </div>
                        `).join('');
                        return `
                            <div class="flex items-center justify-end gap-1.5">
                                <div class="w-6 text-center font-display font-bold text-2xl text-[#2563eb] select-none">${opChar}</div>
                                ${cells}
                            </div>
                        `;
                    }).join('');

                    // Baris Kotak Jawaban di Bawah (dari kanan ke kiri: data-col = totalCols - 1 - c)
                    const ansDigits = String(q.answer).padStart(totalCols, '0').split('');
                    let answerBoxesHtml = '';
                    for (let c = 0; c < totalCols; c++) {
                        const rightToLeftIdx = (totalCols - 1) - c;
                        answerBoxesHtml += `
                            <div class="w-11 flex justify-center">
                                <input type="text" inputmode="none" maxlength="1"
                                    data-q="${qIndex}" data-col="${rightToLeftIdx}"
                                    data-expected="${ansDigits[c]}"
                                    class="digit-box answer-input-${qIndex}" />
                            </div>
                        `;
                    }

                    innerMathHtml = `
                        <div class="inline-flex flex-col py-2">
                            ${carryRowHtml}
                            ${numberRowsHtml}
                            <div class="border-b-[2.5px] border-[#60a5fa] my-2 ml-7"></div>
                            <div class="flex items-center justify-end gap-1.5">
                                <div class="w-6"></div>
                                ${answerBoxesHtml}
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <!-- Header Kartu Soal -->
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-[#eff6ff]">
                        <div class="flex items-center gap-2.5">
                            <span class="w-8 h-8 rounded-xl bg-[#dbeafe] text-[#1d4ed8] font-display font-bold text-sm flex items-center justify-center">
                                ${state.questionNumber}
                            </span>
                            <span id="q-title-${qIndex}" class="font-display font-bold text-base sm:text-lg text-[#1e3a8a] ${q.opGuessed ? '' : 'hidden'}">
                                ${q.titleText}
                            </span>
                        </div>
                        <button id="check-btn-${qIndex}" onclick="verifySingleQuestion(${qIndex})" class="px-3.5 py-1.5 rounded-full bg-[#eef6ff] hover:bg-[#dbeafe] border border-[#bfdbfe] text-xs font-bold text-[#1d4ed8] soft-btn">
                            Periksa
                        </button>
                    </div>

                    ${q.storyText ? `<div class="bg-[#f8fbff] border border-[#dbeafe] rounded-2xl p-3 mb-3 text-xs md:text-sm text-[#334155] leading-relaxed">${q.storyText}</div>` : ''}

                    ${storyPickerHtml}

                    <div id="math-work-${qIndex}" class="${q.opGuessed ? 'flex' : 'hidden'} justify-center my-1 overflow-hidden py-1 w-full">
                        <div id="math-scale-inner-${qIndex}" class="inline-flex justify-center transition-transform origin-top">
                            ${innerMathHtml}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            setupInputNavigation();
            requestAnimationFrame(fitMathWorkToScreen);
        }

        // ================= AUTO-FIT UKURAN AGAR MUAT 1 HALAMAN =================
        function fitMathWorkToScreen() {
            state.questions.forEach((q, qIndex) => {
                const outer = document.getElementById(`math-work-${qIndex}`);
                const inner = document.getElementById(`math-scale-inner-${qIndex}`);
                if (!outer || !inner || outer.classList.contains('hidden')) return;

                inner.style.transform = 'scale(1)';
                inner.style.marginBottom = '0px';

                const availW = outer.clientWidth - 4;
                const naturalW = inner.scrollWidth;
                const naturalH = inner.scrollHeight;

                let scale = 1;
                if (naturalW > availW && availW > 0) {
                    scale = Math.min(scale, availW / naturalW);
                }

                const cardEl = document.getElementById(`qcard-${qIndex}`);
                const numpadHeight = 105;
                const bottomBtnsHeight = 56;
                let maxH = Math.max(180, window.innerHeight * 0.48);

                if (cardEl) {
                    const outerRect = outer.getBoundingClientRect();
                    const availableViewportH = window.innerHeight - outerRect.top - numpadHeight - bottomBtnsHeight - 20;
                    if (availableViewportH > 150) {
                        maxH = Math.min(maxH, availableViewportH);
                    }
                }

                if (naturalH * scale > maxH && naturalH > 0) {
                    scale = Math.min(scale, maxH / naturalH);
                }

                if (scale < 1) {
                    scale = Math.max(0.5, scale);
                    inner.style.transform = `scale(${scale})`;
                    const reducedH = naturalH * (1 - scale);
                    inner.style.marginBottom = `-${Math.floor(reducedH)}px`;
                }
            });
        }

        window.addEventListener('resize', () => {
            requestAnimationFrame(fitMathWorkToScreen);
        });

        // ================= TEBAK OPERASI PADA SOAL CERITA =================
        function guessStoryOp(qIndex, chosenOp, btnEl) {
            const q = state.questions[qIndex];
            const feedbackEl = document.getElementById(`story-feedback-${qIndex}`);

            if (chosenOp === q.actualOp) {
                playTone(587.33, 'sine', 0.14);
                q.opGuessed = true;
                const picker = document.getElementById(`story-picker-${qIndex}`);
                const work = document.getElementById(`math-work-${qIndex}`);
                const title = document.getElementById(`q-title-${qIndex}`);
                if (picker) picker.classList.add('hidden');
                if (work) {
                    work.classList.remove('hidden');
                    work.classList.add('flex');
                }
                if (title) title.classList.remove('hidden');

                setTimeout(() => {
                    const firstInput = getOrderedAnswerInputs(qIndex)[0];
                    if (firstInput) {
                        firstInput.focus();
                        state.lastFocusedInput = firstInput;
                    }
                    fitMathWorkToScreen();
                }, 60);
            } else {
                playErrorSound();
                btnEl.classList.add('wrong-box');
                setTimeout(() => btnEl.classList.remove('wrong-box'), 450);
                if (feedbackEl) {
                    feedbackEl.textContent = 'Kurang tepat, ayo baca kembali ceritanya dengan teliti!';
                    feedbackEl.classList.remove('hidden');
                }
            }
        }

        // ================= NAVIGASI KURSOR & AUTO-CHECK =================
        function getOrderedAnswerInputs(qIndex) {
            const inputs = Array.from(document.querySelectorAll(`.answer-input-${qIndex}`));
            return inputs.sort((a, b) => Number(a.dataset.col) - Number(b.dataset.col));
        }

        function findNextEmptyInputForQuestion(qIndex, currentCol) {
            const ordered = getOrderedAnswerInputs(qIndex);
            // Cari kotak kosong setelah posisi sekarang
            for (const inp of ordered) {
                if (Number(inp.dataset.col) > currentCol && inp.value.trim() === '') {
                    return inp;
                }
            }
            // Jika tidak ada, cari kotak kosong mana saja dari awal urutan
            for (const inp of ordered) {
                if (inp.value.trim() === '') {
                    return inp;
                }
            }
            return null;
        }

        function isQuestionAllFilled(qIndex) {
            const ordered = getOrderedAnswerInputs(qIndex);
            return ordered.length > 0 && ordered.every(inp => inp.value.trim() !== '');
        }

        function handleDigitEntry(inputEl, digit) {
            if (!inputEl || inputEl.disabled) return;
            inputEl.value = digit;
            inputEl.classList.remove('wrong-box');
            playTone(480, 'sine', 0.06);

            const qIndex = Number(inputEl.dataset.q);
            const q = state.questions[qIndex];
            if (!q || q.solved) return;

            // Jika yang diisi adalah kotak simpanan di atas, kembali ke kotak jawaban bawah yang kosong
            if (inputEl.dataset.carryCol !== undefined) {
                const nextEmpty = findNextEmptyInputForQuestion(qIndex, -1);
                if (nextEmpty) {
                    nextEmpty.focus();
                    state.lastFocusedInput = nextEmpty;
                }
                return;
            }

            const currentCol = Number(inputEl.dataset.col);
            if (isQuestionAllFilled(qIndex)) {
                verifySingleQuestion(qIndex);
            } else {
                const nextInput = findNextEmptyInputForQuestion(qIndex, currentCol);
                if (nextInput) {
                    nextInput.focus();
                    state.lastFocusedInput = nextInput;
                }
            }
        }

        function setupInputNavigation() {
            const allInputs = document.querySelectorAll('input[data-q]');
            allInputs.forEach(inp => {
                inp.addEventListener('focus', () => {
                    document.querySelectorAll('input[data-q]').forEach(el => el.classList.remove('active-input'));
                    inp.classList.add('active-input');
                    state.lastFocusedInput = inp;
                });

                inp.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9') {
                        e.preventDefault();
                        handleDigitEntry(inp, e.key);
                    } else if (e.key === 'Backspace' || e.key === 'Delete') {
                        e.preventDefault();
                        inp.value = '';
                        inp.classList.remove('wrong-box');
                    }
                });

                inp.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    if (val.length > 0) {
                        handleDigitEntry(inp, val.slice(-1));
                    } else {
                        inp.value = '';
                    }
                });
            });

            // Fokus otomatis ke kotak pertama jika soal sudah terbuka
            const q0 = state.questions[0];
            if (q0 && q0.opGuessed) {
                const ordered = getOrderedAnswerInputs(0);
                if (ordered[0]) {
                    ordered[0].focus();
                    state.lastFocusedInput = ordered[0];
                }
            }
        }

        // ================= PAPAN ANGKA CEPAT (NUMPAD BAWAH) =================
        function numpadPress(digit) {
            let target = state.lastFocusedInput;
            if (!target || target.disabled || !document.body.contains(target)) {
                const ordered = getOrderedAnswerInputs(0);
                target = ordered.find(inp => inp.value.trim() === '') || ordered[0];
            }
            if (target && !target.disabled) {
                target.focus();
                handleDigitEntry(target, digit);
            }
        }

        function numpadBackspace() {
            const target = state.lastFocusedInput;
            if (target && !target.disabled && document.body.contains(target)) {
                target.value = '';
                target.classList.remove('wrong-box');
                target.focus();
            }
        }

        // ================= PEMERIKSAAN JAWABAN & KUNCI OTOMATIS =================
        function getExpectedDigitForBox(q, colIdx, inputEl) {
            if (q.isFraction) {
                return q.fracData.expectedBoxes[colIdx].digit;
            }
            if (q.actualOp === 'bagi') {
                return q.divisionData.expectedBoxes[colIdx].digit;
            }
            if (q.multiMultiplyData) {
                return q.multiMultiplyData.expectedBoxes[colIdx].digit;
            }
            return inputEl.dataset.expected;
        }

        function verifySingleQuestion(qIndex) {
            const q = state.questions[qIndex];
            if (!q || q.solved) return;

            const ordered = getOrderedAnswerInputs(qIndex);
            let allCorrect = true;
            let firstWrongInput = null;

            ordered.forEach(inp => {
                const colIdx = Number(inp.dataset.col);
                const expectedDigit = getExpectedDigitForBox(q, colIdx, inp);
                const userDigit = inp.value.trim();

                if (userDigit === expectedDigit) {
                    inp.classList.remove('wrong-box');
                    inp.classList.add('correct-box');
                } else {
                    allCorrect = false;
                    inp.classList.remove('correct-box');
                    inp.classList.add('wrong-box');
                    if (!firstWrongInput) firstWrongInput = inp;
                }
            });

            const stats = getCurrentStats();
            if (allCorrect) {
                q.solved = true;
                playSuccessSound();
                stats.score += 10;
                stats.streak += 1;
                updateStatsUI();

                // Kunci seluruh input pada soal ini agar tidak bisa diedit lagi
                document.querySelectorAll(`input[data-q="${qIndex}"]`).forEach(el => {
                    el.disabled = true;
                    el.classList.remove('active-input');
                });

                const checkBtn = document.getElementById(`check-btn-${qIndex}`);
                if (checkBtn) {
                    checkBtn.textContent = '✓ Benar!';
                    checkBtn.className = 'px-3.5 py-1.5 rounded-full bg-[#ecfdf5] border border-[#6ee7b7] text-xs font-bold text-[#047857]';
                    checkBtn.disabled = true;
                }
            } else {
                playErrorSound();
                // Kurangi streak 1 jika salah (tidak di-reset ke 0)
                stats.streak = Math.max(0, stats.streak - 1);
                updateStatsUI();

                if (firstWrongInput) {
                    firstWrongInput.focus();
                    state.lastFocusedInput = firstWrongInput;
                }
            }
        }

        function checkCurrentQuestion() {
            verifySingleQuestion(0);
        }

        // Inisialisasi Saat Halaman Dimuat
        window.addEventListener('DOMContentLoaded', () => {
            updateControlStyles();
            generateAllQuestions();
        });
    </script>
</body>
</html>
